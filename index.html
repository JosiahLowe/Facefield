<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="">
  <title>Facefield — A living wall of faces</title>
  <link rel="stylesheet" href="styles.css?v=square-world-1">
  <script type="module" src="app.js?v=square-world-1"></script>
</head>
<body>
  <div id="world">
    <main id="grid" aria-label="Facefield: tap a face to remake it"></main>
  </div>
  <nav class="controls" aria-label="Grid controls">
    <button id="seed" title="Copy a link to this exact grid">Copy seed link</button>
    <button id="test-mouths" title="Choose a new neutral, smiling, or frowning expression">Change mouths</button>
    <button id="shuffle"><span aria-hidden="true">↻</span> Shuffle</button>
  </nav>
  <span id="status" class="sr-only" role="status"></span>
</body>
</html>
