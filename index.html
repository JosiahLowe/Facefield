<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5ff00">
  <title>Facefield — A living wall of faces</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js?v=expression-switch-1"></script>
</head>
<body>
  <main id="grid" aria-label="Facefield: tap a face to remake it"></main>
  <nav class="controls" aria-label="Grid controls">
    <button id="seed" title="Copy a link to this exact grid">Copy seed link</button>
    <button id="test-mouths" aria-pressed="false" title="Immediately preview mouth movement">Test mouths</button>
    <button id="shuffle"><span aria-hidden="true">↻</span> Shuffle</button>
  </nav>
  <span id="status" class="sr-only" role="status"></span>
</body>
</html>
